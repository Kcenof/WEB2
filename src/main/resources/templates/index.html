<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Список елементів</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h1>Елементи</h1>
    <a class="btn btn-success mb-3" href="/items/new">Додати</a>
    <table class="table table-striped">
        <tr>
            <th>Назва</th>
            <th>Опис</th>
            <th>Дії</th>
        </tr>
        <tr th:each="item : ${items}">
            <td th:text="${item.name}">Name</td>
            <td th:text="${item.description}">Description</td>
            <td>
                <a class="btn btn-warning btn-sm" th:href="@{/items/edit/{id}(id=${item.id})}">Редагувати</a>
                <a class="btn btn-danger btn-sm" th:href="@{/items/delete/{id}(id=${item.id})}">Видалити</a>
            </td>
        </tr>
    </table>
</div>
</body>
</html>
